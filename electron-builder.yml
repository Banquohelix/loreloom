appId: com.loreloom.studio
productName: Loreloom
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
