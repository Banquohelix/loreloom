name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Package Windows installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ($env:CSC_LINK) {
            pnpm run build
            pnpm exec electron-builder --win --publish never --config.win.signAndEditExecutable=true
          } else {
            pnpm run build
            pnpm exec electron-builder --win --publish never
          }
          $setupExe = Get-ChildItem -Path release -Filter "*Setup*.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item -Path $setupExe.FullName -Destination "release/Loreloom-Setup-Latest.exe" -Force
          }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: loreloom-windows-release
          path: release/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.exe
          generate_release_notes: true
